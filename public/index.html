<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dragon Chat</title>
  <meta name="description" content="A fast, clean AI chat with text and image understanding, powered by Dragon.">
  <meta name="theme-color" content="#212121">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme-init.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div id="sidebar-backdrop" class="backdrop"></div>

    <aside id="sidebar" class="sidebar" aria-label="Chat history">
      <div class="sidebar-top">
        <button id="logo-btn" class="icon-btn logo-btn" aria-label="New chat" data-icon="logo" data-size="22"></button>
        <button id="collapse-btn" class="icon-btn" aria-label="Close sidebar" data-icon="sidebar" data-size="20"></button>
      </div>
      <nav class="sidebar-nav">
        <button id="new-chat-btn" class="nav-btn" type="button"><span data-icon="newchat" data-size="18"></span><span>New chat</span></button>
        <button id="search-btn" class="nav-btn" type="button"><span data-icon="search" data-size="18"></span><span>Search chats</span></button>
      </nav>
      <div class="sidebar-scroll"><div id="chat-list" class="chat-list"></div></div>
      <div class="sidebar-bottom">
        <button id="settings-btn" class="nav-btn" type="button"><span data-icon="settings" data-size="18"></span><span>Settings</span></button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button id="open-sidebar-btn" class="icon-btn only-collapsed" aria-label="Open sidebar" data-icon="sidebar" data-size="20"></button>
        <button id="new-chat-top" class="icon-btn only-collapsed" aria-label="New chat" data-icon="newchat" data-size="20"></button>
        <button id="model-btn" class="model-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="model-label">Dragon</span><span data-icon="chevron" data-size="16"></span>
        </button>
      </header>

      <div id="banner" class="banner" hidden></div>

      <main id="main" class="main is-empty">
        <div id="thread" class="thread" tabindex="-1">
          <div id="thread-inner" class="thread-inner"></div>
        </div>
        <section class="composer-area">
          <button id="scroll-btn" class="scroll-btn" type="button" aria-label="Scroll to bottom" data-icon="arrowdown" data-size="18" hidden></button>
          <h1 id="greeting" class="greeting">What can I help with?</h1>

          <form id="composer" class="composer" autocomplete="off">
            <div id="attachments" class="attachments" hidden></div>
            <div class="composer-row">
              <button id="attach-btn" class="icon-btn composer-btn" type="button" aria-label="Add photos" title="Add photos" data-icon="plus" data-size="20"></button>
              <textarea id="prompt" rows="1" placeholder="Ask anything" aria-label="Message" enterkeyhint="send"></textarea>
              <button id="send-btn" class="send-btn" type="submit" aria-label="Send message" disabled data-icon="send" data-size="20"></button>
            </div>
            <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/heic,image/heif" multiple hidden>
          </form>

          <div id="chips" class="chips"></div>
          <p id="disclaimer" class="disclaimer"></p>
        </section>
      </main>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <div id="drop-overlay" class="drop-overlay" hidden><div class="drop-card"><span data-icon="image" data-size="28"></span><strong>Add images</strong><span>Drop them here to attach to your message</span></div></div>

  <noscript><p style="padding:24px;font-family:sans-serif">This app needs JavaScript to run.</p></noscript>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
